name: tmp-web-fetch-pixcard-20261126
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and stage
        run: |
          set -e
          mkdir -p pixel-card-assets /tmp/dl
          curl -fL -o /tmp/dl/pixelcardassest_v02.png 'https://opengameart.org/sites/default/files/pixelcardassest_v02.png'
          cp /tmp/dl/pixelcardassest_v02.png pixel-card-assets/preview.png
          (cd /tmp/dl && zip -q -j /tmp/dl/pcard.zip pixelcardassest_v02.png)
          cp /tmp/dl/pcard.zip pixel-card-assets/pixel-card-assets.zip
          echo  | base64 -d > pixel-card-assets/meta.json
          ls -la pixel-card-assets
      - name: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- pixel-card-assets
          git commit -m 'assets: 웹 탐색 2회차 2D 팩 추가 (Pixel Card Assets, CC0)'
          git pull --rebase -q || true
          git push
