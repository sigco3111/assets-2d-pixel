name: 임시 2D 정리

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 정리와 이펙트 1팩 추가
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSL "https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/tools/tmp_a98_fix2d.py" -o /tmp/fix.py
          python3 -u /tmp/fix.py
