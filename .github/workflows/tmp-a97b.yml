name: A97 add 2d
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: add pack
        run: |
          set -euo pipefail
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          pip install --quiet pillow
          echo '' | base64 -d > /tmp/add.py
          python3 /tmp/add.py
      - name: cleanup
        if: always()
        run: |
          git rm -f .github/workflows/tmp-a97.yml .github/workflows/tmp-a97b.yml || true
          git commit -m "정리: A97 임시 파일 삭제" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
