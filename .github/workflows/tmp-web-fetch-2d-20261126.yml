name: tmp-web-fetch-2d-20261126
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and stage
        run: |
          set -e
          mkdir -p chess-tilesheet dosega-style-platformer-tiles /tmp/dl
          curl -fL -o chess-tilesheet/chess-tilesheet.zip 'https://opengameart.org/sites/default/files/chess-tileset.zip'
          curl -fL -o chess-tilesheet/preview.png 'https://opengameart.org/sites/default/files/resized-640x640.png'
          curl -fL -o /tmp/dl/dosgametiles.png 'https://opengameart.org/sites/default/files/dosgametiles.png'
          cp /tmp/dl/dosgametiles.png dosega-style-platformer-tiles/preview.png
          (cd /tmp/dl && zip -q -j /tmp/dl/dosega.zip dosgametiles.png)
          cp /tmp/dl/dosega.zip dosega-style-platformer-tiles/dosega-style-platformer-tiles.zip
          echo  | base64 -d > chess-tilesheet/meta.json
          echo  | base64 -d > dosega-style-platformer-tiles/meta.json
          ls -la chess-tilesheet dosega-style-platformer-tiles
      - name: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chess-tilesheet dosega-style-platformer-tiles
          git commit -m 'assets: 웹 탐색 2회차 2D 팩 2종 추가 (CC0)'
          git pull --rebase -q || true
          git push
