name: a92-get2d
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ingest
        run: |
          set -uo pipefail
          git config user.name sigco3111
          git config user.email sigco3111@gmail.com
          if ! command -v convert >/dev/null 2>&1 && ! command -v magick >/dev/null 2>&1; then sudo apt-get update -qq; sudo apt-get install -y -qq imagemagick; fi
          mkdir -p previews
          cat > /tmp/list.tsv <<'EOF'
          2d-explosion-animations-2-frame-by-frame|2D Explosion Animations #2 | Frame by frame|https://opengameart.org/content/2d-explosion-animations-2-frame-by-frame
          EOF
          while IFS='|' read -u 3 -r SLUG NAME PAGE; do
            echo "== $NAME"
            if [ -d "$SLUG" ]; then echo "SKIP exists $SLUG"; continue; fi
            curl -sSL -m 60 "$PAGE" -o /tmp/page.html || { echo "SKIP page $NAME"; continue; }
            FILEURL=$(grep -o 'href="[^"]*sites/default/files/[^"]*"' /tmp/page.html | sed 's/^href="//;s/"$//' | grep -Ei '[.](zip|7z|rar|tgz)$' | head -1)
            if [ -z "$FILEURL" ]; then echo "NOFILE $NAME"; continue; fi
            case "$FILEURL" in /*) FILEURL=https://opengameart.org$FILEURL;; esac
            EXT=$(echo "${FILEURL##*.}" | tr A-Z a-z)
            mkdir -p "$SLUG/.tmp/x"
            curl -sSL -m 300 "$FILEURL" -o "$SLUG/.tmp/pack.$EXT" || { echo "SKIP dl $NAME"; rm -rf "$SLUG"; continue; }
            if [ ! -s "$SLUG/.tmp/pack.$EXT" ]; then echo "SKIP empty $NAME"; rm -rf "$SLUG"; continue; fi
            echo "size=$(stat -c%s "$SLUG/.tmp/pack.$EXT") ext=$EXT"
            if [ "$EXT" = zip ]; then unzip -q -o "$SLUG/.tmp/pack.zip" -d "$SLUG/.tmp/x" < /dev/null || true; fi
            if [ "$EXT" = 7z ]; then 7z x -y -o"$SLUG/.tmp/x" "$SLUG/.tmp/pack.7z" < /dev/null >/dev/null || true; fi
            mv "$SLUG/.tmp/pack.$EXT" "$SLUG/$SLUG.$EXT"
            git add "$SLUG"; git commit -q -m "에셋: $NAME 추가" < /dev/null; echo "ASSET OK $NAME"
            IMG=$(find "$SLUG/.tmp/x" -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) -size +8k -printf "%s\t%p\n" 2>/dev/null | sort -nr | head -1 | cut -f2)
            if [ -z "$IMG" ]; then
              OG=$(grep -o 'https://opengameart.org/sites/default/files/[^" ]*' /tmp/page.html | grep -Ei '[.](png|jpg|jpeg)' | head -1)
              if [ -n "$OG" ]; then curl -sSL -m 60 "$OG" -o "$SLUG/.tmp/og.img"; IMG="$SLUG/.tmp/og.img"; fi
            fi
            rm -rf "$SLUG/.tmp"
            if [ -n "$IMG" ] && [ -s "$IMG" ]; then
              rm -f "previews/$SLUG.png" "previews/$SLUG.jpg"
              convert "$IMG" -resize "480x480>" -strip "previews/$SLUG.png" < /dev/null 2>/dev/null || true
              if [ -s "previews/$SLUG.png" ] && [ "$(stat -c%s "previews/$SLUG.png")" -gt 204800 ]; then
                convert "$IMG" -resize "480x480>" -strip -quality 85 "previews/$SLUG.jpg" < /dev/null 2>/dev/null || true
                if [ -s "previews/$SLUG.jpg" ]; then rm -f "previews/$SLUG.png"; fi
              fi
              if [ -s "previews/$SLUG.png" ] || [ -s "previews/$SLUG.jpg" ]; then
                git add previews; git commit -q -m "썸네일: $NAME 추가" < /dev/null; echo "PREVIEW OK $NAME"
              else echo "PREVIEW FAIL $NAME"; fi
            else echo "PREVIEW FAIL $NAME"; fi
          done 3< /tmp/list.tsv
          git push origin HEAD:main
          git log --oneline -6
