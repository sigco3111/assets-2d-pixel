name: a104-go3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq imagemagick >/dev/null 2>&1
      - name: run
        run: |
          python3 - <<'PY' > /tmp/l.txt 2>&1 || true
          import os,sys,io,csv,zipfile,subprocess,urllib.request
          c={"name":"Fire Wrath - Magic Effect","slug":"fire-wrath-magic-effect","author":"Cethiel","page":"https://opengameart.org/content/fire-wrath-magic-effect","zip":"Fire Wrath - Magic Effect.zip","img":"https://opengameart.org/sites/default/files/Preview_1_11.png"}
          def get(u):
              r=urllib.request.Request(u,headers={"User-Agent":"vooy-asset-bot/1.0"})
              return urllib.request.urlopen(r,timeout=120).read()
          cat=get("https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/catalog.csv").decode("utf-8")
          names={row[0].strip().lower() for row in csv.reader(io.StringIO(cat)) if row}
          subprocess.run(["git","config","user.name","sigco3111"],check=True)
          subprocess.run(["git","config","user.email","101856311+sigco3111@users.noreply.github.com"],check=True)
          slug=c["slug"]
          if os.path.isdir(slug) or c["name"].lower() in names:
              print("SKIP",c["name"])
          else:
              os.makedirs(slug)
              zname="fire-wrath-magic-effect.zip"
              data=get("https://opengameart.org/sites/default/files/"+urllib.parse.quote(c["zip"]))
              open(os.path.join(slug,zname),"wb").write(data)
              n=len(zipfile.ZipFile(os.path.join(slug,zname)).namelist())
              open(os.path.join(slug,"pack.md"),"w").write(
                "# "+c["name"]+"\n\n- 출처 URL: "+c["page"]+"\n- 받은 파일: "+zname+" (%.1fMB)\n"%(len(data)/1048576.0)+
                "- 라이선스: CC0\n- 제작자: "+c["author"]+"\n- 파일 수: "+str(n)+"\n- 파일 크기(바이트): "+str(len(data))+
                "\n- 태그: 2d,effect,magic,fire\n- AI 생성 여부: 출처 페이지에 언급 없음\n")
              open(os.path.join(slug,"LICENSE-SOURCE.txt"),"w").write(
                c["name"]+"\n\n출처 URL: "+c["page"]+"\n표기 라이선스: CC0\n제작자: "+c["author"]+"\n")
              open(os.path.join(slug,"CREDITS.txt"),"w").write(c["name"]+" - "+c["author"]+"\n라이선스: CC0\n출처: "+c["page"]+"\n")
              open(os.path.join(slug,"LICENSE-CC0.txt"),"w").write(get("https://creativecommons.org/publicdomain/zero/1.0/legalcode.txt").decode("utf-8"))
              open("/tmp/srcimg","wb").write(get(c["img"]))
              subprocess.run(["convert","/tmp/srcimg[0]","-resize","800x800>",os.path.join(slug,"preview.png")],check=True)
              subprocess.run(["git","add","-A"],check=True)
              subprocess.run(["git","commit","-m","에셋: "+c["name"]+" 추가"],check=True)
              subprocess.run(["git","push"],check=True)
              print("ADDED",c["name"],len(data))
          PY
          cat /tmp/l.txt
          cp /tmp/l.txt a104-log2.txt
          git add a104-log2.txt
          git commit -m 'tmp: A104 2D 로그' || true
          git push || true
