name: tmp-web-fetch-2dfl-20261126
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and stage
        run: |
          set -e
          mkdir -p low-res-computer-fan realistic-flashlight-cookies /tmp/dl
          curl -fL -o /tmp/dl/fanwalpha.png 'https://opengameart.org/sites/default/files/fanwalpha.png'
          curl -fL -o /tmp/dl/light_04.png 'https://opengameart.org/sites/default/files/light_04.png'
          cp /tmp/dl/fanwalpha.png low-res-computer-fan/preview.png
          cp /tmp/dl/light_04.png realistic-flashlight-cookies/preview.png
          (cd /tmp/dl && zip -q -j fan.zip fanwalpha.png && cp fan.zip /tmp/dl/fanout.zip)
          cp /tmp/dl/fanout.zip low-res-computer-fan/low-res-computer-fan.zip
          (cd /tmp/dl && zip -q -j light.zip light_04.png)
          cp /tmp/dl/light.zip realistic-flashlight-cookies/realistic-flashlight-cookies.zip
          echo  | base64 -d > low-res-computer-fan/meta.json
          echo  | base64 -d > realistic-flashlight-cookies/meta.json
          ls -la low-res-computer-fan realistic-flashlight-cookies
      - name: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- low-res-computer-fan realistic-flashlight-cookies
          git commit -m 'assets: 웹 탐색 2회차 2D 팩 추가 (Low Res Computer fan, Realistic Flashlight Cookies, CC0)'
          git pull --rebase -q || true
          git push
