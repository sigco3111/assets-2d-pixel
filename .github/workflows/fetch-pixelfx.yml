{"name":"fetch-pixelfx","on":"workflow_dispatch","permissions":{"contents":"write"},"jobs":{"fetch":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"fetch","run":"set -e; git clone --depth 1 https://github.com/patch-gg/pixelfx /tmp/px; git -C /tmp/px rev-parse HEAD > /tmp/hash.txt; rm -rf /tmp/px/.git; rm -rf pixelfx; cp -r /tmp/px pixelfx; SZ=$(du -sm pixelfx | cut -f1); echo size_MB=$SZ; [ \"$SZ\" -le 40 ]; printf 'source: https://github.com/patch-gg/pixelfx\ncommit: %s\n' \"$(cat /tmp/hash.txt)\" > pixelfx/SOURCE-COMMIT.txt"},{"name":"commit","run":"git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add pixelfx; git commit -m '에셋: pixelfx 이펙트 244종 추가'; git push"}]}}}
