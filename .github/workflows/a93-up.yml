name: a93-up
on:
  workflow_dispatch:
    inputs:
      mode:
        description: upload or cleanup
        default: upload
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: upload
        if: inputs.mode != 'cleanup'
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/catalog.csv https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/catalog.csv
          git config user.name sigco3111
          git config user.email sigco3111@gmail.com
          python3 - <<'PY'
          import os, re, subprocess, shutil, urllib.request
          PACKS = [
          dict(name="Pixel FX Pack", repo="assets-2d-pixel", slug="pixel-fx-pack", typ="2D 이펙트", tags="effect,vfx,hit,magic,pixel", author="CodeManu", page="https://opengameart.org/content/pixel-fx-pack", zip="https://opengameart.org/sites/default/files/pixel_effects.zip", lic="CC0"),
          ]
          def sh(c):
              subprocess.run(c, shell=True, check=True)
          def fetch(u, dst):
              req = urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0 a93"})
              open(dst,"wb").write(urllib.request.urlopen(req, timeout=180).read())

          cat = open("/tmp/catalog.csv", encoding="utf-8").read().lower()
          res = []
          for p in PACKS:
              d = p["slug"]
              if ('"' + p["name"].lower() + '",') in cat or ("\n" + p["name"].lower() + ",") in cat:
                  print("SKIP dup", p["name"]); continue
              if os.path.isdir(d):
                  print("SKIP exists", d); continue
              os.makedirs(d, exist_ok=True)
              z = "/tmp/" + d + ".zip"
              fetch(p["zip"], z)
              shutil.copy(z, os.path.join(d, d + ".zip"))
              sh("cd '%s' && unzip -q -o '%s.zip' -d _x && cp -r _x/. . 2>/dev/null || true; rm -rf _x" % (d, d))
              ents = [e for e in os.listdir(d) if e != d + ".zip"]
              if len(ents) == 1 and os.path.isdir(os.path.join(d, ents[0])):
                  sub = os.path.join(d, ents[0])
                  for e in os.listdir(sub):
                      shutil.move(os.path.join(sub, e), os.path.join(d, e))
                  os.rmdir(sub)
              imgs = []
              for root, _, fs in os.walk(d):
                  for f in fs:
                      if f.lower().endswith((".png",".jpg",".jpeg",".webp")):
                          imgs.append(os.path.join(root, f))
              src = None
              for i in imgs:
                  if os.path.basename(i).lower().startswith("preview"):
                      src = i; break
              if not src and imgs:
                  src = max(imgs, key=os.path.getsize)
              if not src:
                  try:
                      req = urllib.request.Request(p["page"], headers={"User-Agent":"Mozilla/5.0"})
                      h = urllib.request.urlopen(req, timeout=60).read().decode("utf-8","ignore")
                      m = re.search(r'<meta[^>]+property="og:image"[^>]+content="([^"]+)"', h)
                      if not m:
                          m = re.search(r'<img[^>]+src="(/sites/default/files/[^"]+\.(?:png|jpg|jpeg))"', h)
                      if m:
                          u = m.group(1)
                          if u.startswith("/"):
                              u = "https://opengameart.org" + u
                          fetch(u, "/tmp/og.img")
                          src = "/tmp/og.img"
                  except Exception as e:
                      print("NOPREVIEW", d, str(e)[:80])
              pv = ""
              if src:
                  os.makedirs("previews", exist_ok=True)
                  out = "/tmp/pv.png"
                  sh("convert '%s'[0] -resize '480x480>' -strip '%s'" % (src, out))
                  if os.path.getsize(out) > 200 * 1024:
                      sh("convert '%s' -quality 85 '%s'" % (out, "/tmp/pv.jpg"))
                      shutil.move("/tmp/pv.jpg", "previews/%s.jpg" % d)
                      pv = "previews/%s.jpg" % d
                  else:
                      shutil.move(out, "previews/%s.png" % d)
                      pv = "previews/%s.png" % d
              if "CC-BY" in p["lic"] and "CC-BY-SA" not in p["lic"]:
                  open(os.path.join(d, "CREDITS.txt"), "w", encoding="utf-8").write(
                      p["name"] + "\n\nAuthor: " + p["author"] + "\nSource: " + p["page"] + "\nLicense: " + p["lic"] + "\n")
              sh("git add -A '%s'" % d)
              sh('git commit -q -m "에셋: %s 추가"' % p["name"])
              if pv:
                  sh("git add '%s'" % pv)
                  sh('git commit -q -m "썸네일: %s 추가"' % p["name"])
              res.append("|".join([p["name"], p["repo"], d + "/" + d + ".zip", pv, p["lic"], p["typ"], p["author"], p["page"], p["tags"]]))
              print("ADDED", p["name"], pv)

          open("a93-res.txt", "a", encoding="utf-8").write("\n".join(res) + "\n")
          print("DONE", len(res))

          PY
          git add a93-res.txt
          git commit -q -m "A93: 결과 기록" || true
          git push origin HEAD:main
      - name: cleanup
        if: inputs.mode == 'cleanup'
        run: |
          git config user.name sigco3111
          git config user.email sigco3111@gmail.com
          git rm -q --ignore-unmatch .github/workflows/a93-up.yml a93-res.txt
          git commit -q -m "A93: 임시 파일 삭제" || true
          git push origin HEAD:main
