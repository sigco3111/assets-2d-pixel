name: a92-get2e
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ingest
        run: |
          exec > /tmp/log.txt 2>&1
          set -x
          git config user.name sigco3111
          git config user.email sigco3111@gmail.com
          SLUG=2d-explosion-animations-2-frame-by-frame
          PAGE=https://opengameart.org/content/2d-explosion-animations-2-frame-by-frame
          curl -sSL -m 60 "$PAGE" -o /tmp/page.html
          FILEURL=$(grep -o 'href="[^"]*sites/default/files/[^"]*"' /tmp/page.html | sed 's/^href="//;s/"$//' | grep -Ei '[.](zip|7z|rar|tgz)$' | head -1)
          echo "FILEURL=$FILEURL"
          case "$FILEURL" in /*) FILEURL=https://opengameart.org$FILEURL;; esac
          mkdir -p "$SLUG"
          curl -sSL -m 300 "$FILEURL" -o "$SLUG/$SLUG.zip"
          ls -l "$SLUG"
          git add -f "$SLUG"
          git status --porcelain
          git commit -m "에셋: 2D Explosion Animations #2 | Frame by frame 추가" || true
          git push origin HEAD:main || true
          git log --oneline -3
          cat /tmp/log.txt > a92-log.txt || true
          git add -f a92-log.txt
          git commit -m "A92: 로그" || true
          git push origin HEAD:main || true
