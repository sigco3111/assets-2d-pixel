name: tmp-thumb2

on:
  push:
    paths:
      - .github/workflows/tmp-thumb2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pillow 설치
        run: python3 -m pip install pillow

      - name: 썸네일 생성
        run: |
          cat > /tmp/gen.py <<'PY'
          import io, os, sys, zipfile, traceback
          from PIL import Image

          BG = (28, 30, 36, 255)
          os.makedirs("previews", exist_ok=True)


          def images_from_zip(path):
              z = zipfile.ZipFile(path)
              out = []
              for n in sorted(z.namelist()):
                  if n.endswith("/"):
                      continue
                  try:
                      im = Image.open(io.BytesIO(z.read(n)))
                      im.load()
                      out.append((n, im.convert("RGBA")))
                      print("loaded", path, n, im.size, im.mode)
                  except Exception as exc:
                      print("skip", path, n, repr(exc))
              return out


          def main():
              fs = images_from_zip("16x16-explosion/16x16-explosion.zip")
              print("16x16 count:", len(fs))
              if fs:
                  scale, pad = 8, 12
                  w = sum(im.width * scale for _, im in fs) + pad * (len(fs) + 1)
                  h = max(im.height * scale for _, im in fs) + pad * 2
                  canvas = Image.new("RGBA", (w, h), BG)
                  x = pad
                  for _, im in fs:
                      big = im.resize((im.width * scale, im.height * scale), Image.NEAREST)
                      canvas.alpha_composite(big, (x, (h - big.height) // 2))
                      x = x + big.width + pad
                  canvas.convert("RGB").save("previews/16x16-explosion.png", optimize=True)
                  print("wrote previews/16x16-explosion.png", canvas.size)

              sh = images_from_zip("shield-spell/shield.zip")
              print("shield count:", len(sh))
              if sh:
                  im = max([i for _, i in sh], key=lambda i: i.width * i.height)
                  if im.width > 640:
                      im = im.resize((640, max(1, round(im.height * 640 / im.width))), Image.LANCZOS)
                  c = Image.new("RGBA", im.size, BG)
                  c.alpha_composite(im, (0, 0))
                  c.convert("RGB").save("previews/shield-spell.png", optimize=True)
                  print("wrote previews/shield-spell.png", c.size)


          try:
              main()
          except Exception:
              tb = traceback.format_exc()
              print(tb)
              print("::error::" + tb.replace("\n", " | "))
              sys.exit(1)
          PY
          python3 /tmp/gen.py
          ls -la previews | tail -5

      - name: 커밋과 push
        run: |
          git config user.name "sigco3111"
          git config user.email "sigco3111k@gmail.com"
          git add previews/16x16-explosion.png
          git commit -m "썸네일: 16x16 Explosion 보완" || true
          git add previews/shield-spell.png
          git commit -m "썸네일: Shield Spell 보완" || true
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "push 완료"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::push 실패"
          exit 1
