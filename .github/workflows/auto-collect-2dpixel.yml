{"name":"auto-collect-2dpixel","on":{"schedule":[{"cron":"11,26,41,56 * * * *"}],"workflow_dispatch":{"inputs":{"dry_run":{"description":"list candidates only","required":false,"type":"boolean","default":true},"max_packs":{"description":"packs per run (default 2)","required":false,"type":"string","default":"2"}}}},"concurrency":{"group":"auto-collect-2dpixel","cancel-in-progress":false},"permissions":{"contents":"write"},"jobs":{"collect":{"runs-on":"ubuntu-latest","timeout-minutes":40,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":1}},{"uses":"actions/checkout@v4","with":{"repository":"sigco3111/assets-3d-lowpoly-2","path":"src","fetch-depth":1}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"kill-switch check","run":"test -f triggers/auto-collect-stop.txt && echo 'STOP: kill-switch on' >> $GITHUB_STEP_SUMMARY || true"},{"name":"install pillow","if":"hashFiles('triggers/auto-collect-stop.txt') == ''","run":"pip install -q pillow"},{"name":"transform collect code","if":"hashFiles('triggers/auto-collect-stop.txt') == ''","run":"python3 - <<'PY'\nimport json,re\nw=json.load(open('src/.github/workflows/auto-collect.yml',encoding='utf-8'))\nrun=[s for s in w['jobs']['collect']['steps'] if s.get('name')=='collect'][0]['run']\nbody=run.split('\\n',1)[1].rsplit('\\nPY',1)[0]\nR=[(\"REPO = 'sigco3111/assets-3d-lowpoly-2'\",\"REPO = 'sigco3111/assets-2d-pixel'\"),\n(\"field_art_type_tid%5B%5D=10\",\"field_art_type_tid%5B%5D=9\"),\n(\"'3d,opengameart'\",\"'2d,pixel,opengameart'\"),\n(\"kind='3D 모델'\",\"kind='2D 스프라이트'\"),\n(\"(blend|obj|fbx|glb|gltf|dae)$', n, re.I) for n in names\",\"(png|jpg|jpeg|gif|webp)$', n, re.I) for n in names\"),\n(\"'3D 파일 없음'\",\"'2D 파일 없음'\"),\n(\"if size_mb > 700:\",\"if size_mb > 650:\")]\nfor a,b in R:\n    assert body.count(a)==1, a\n    body=body.replace(a,b)\nopen('/tmp/collect.py','w',encoding='utf-8').write(body)\nprint('transform ok', len(body))\nPY"},{"name":"collect","if":"hashFiles('triggers/auto-collect-stop.txt') == ''","env":{"DRY":"${{ github.event_name == 'schedule' && 'true' || inputs.dry_run && 'true' || 'false' }}","MAXP":"${{ inputs.max_packs || '2' }}","GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"run":"python3 /tmp/collect.py"}]}}}
