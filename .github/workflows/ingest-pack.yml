name: ingest-pack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Animated Charged Bolt
        run: |
          set -euo pipefail
          D=animated-charged-bolt
          mkdir -p "$D"
          curl -fsSL -o "$D/hjm-charged_bolt_v4_0.zip" "https://opengameart.org/sites/default/files/hjm-charged_bolt_v4_0.zip"
          curl -fsSL -o /tmp/bolt.gif "https://opengameart.org/sites/default/files/hjm-charged_bolt_v3_0.gif"
          convert "/tmp/bolt.gif[0]" -resize "900x900>" "$D/preview.jpg"
          cat > "$D/pack.md" <<'EOF'
          # Animated Charged Bolt

          - 출처 URL: https://opengameart.org/content/animated-charged-bolt
          - 받은 파일: hjm-charged_bolt_v4_0.zip (4.2 MB)
          - 라이선스: CC-BY 4.0
          - 제작자: Varkalandar (Hansjörg Malthaner)
          - 공개일: 2019-11-13
          - 파일 수: 1 (zip 안 48프레임 PNG, 400x300)
          - 태그: magic, spell, bolt, projectile, effect, animated, 2d
          - 표기 요구: 있음 ("For attribution, please state my name, Hansjörg Malthaner, and link here: http://opengameart.org/users/varkalandar", CREDITS.txt 참조)
          - AI 생성 여부: 출처 페이지에 언급 없음
          EOF
          cat > "$D/LICENSE-SOURCE.txt" <<'EOF'
          Animated Charged Bolt

          출처 URL: https://opengameart.org/content/animated-charged-bolt
          표기 라이선스: CC-BY 4.0 (페이지에 CC-BY 3.0·CC-BY-SA 3.0/4.0·OGA-BY 3.0도 함께 표기, CC-BY 4.0으로 수록)
          제작자: Varkalandar (Hansjörg Malthaner)
          공개일: 2019-11-13

          이 파일은 수집자가 출처 페이지의 라이선스 표기를 기록한 것입니다.
          원본 배포물(zip)에 라이선스 파일이 포함되어 있지 않으면 이 파일이 그 역할을 합니다.
          EOF
          cat > "$D/CREDITS.txt" <<'EOF'
          Animated Charged Bolt

          For attribution, please state my name, Hansjörg Malthaner, and link here: http://opengameart.org/users/varkalandar
          원본: https://opengameart.org/content/animated-charged-bolt
          라이선스: CC-BY 4.0 (https://creativecommons.org/licenses/by/4.0/)
          EOF
          git add -A
          git -c user.name=sigco3111 -c user.email=sigco3111@users.noreply.github.com commit -m "에셋: Animated Charged Bolt 추가"
          git push
