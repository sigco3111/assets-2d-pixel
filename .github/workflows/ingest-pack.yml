name: ingest-pack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick unzip zip
      - run: bash .github/scripts/one.sh circular-effect-animations https://opengameart.org/sites/default/files/circular_effect_animations_-_spritesheets.png "Circular effect animations" "CC-BY 4.0" "Vircon32 (Carra)" 2024-11-17 effect,magic,circle,spritesheet "https://opengameart.org/content/circular-effect-animations" yes
