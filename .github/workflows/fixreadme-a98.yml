name: 임시 README 개수 정리

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 개수 줄 수정
        run: |
          set -e
          git config user.name "sigco3111"
          git config user.email "sigco3111k@gmail.com"
          python3 - <<'PY'
          p = "README.md"
          t = open(p, encoding="utf-8").read()
          assert "현재 총 656팩" in t, "count line not found"
          t = t.replace("현재 총 656팩", "현재 총 658팩", 1)
          t = t.replace("assets-2d-pixel 저장소 팩 수; ", "assets-2d-pixel 저장소 팩 수; A98: FIre and Spell Animations 이펙트 1팩 추가(658팩). ", 1)
          open(p, "w", encoding="utf-8").write(t)
          PY
          git add README.md
          git rm -q .github/workflows/fixreadme-a98.yml
          git commit -m "문서: A98 이펙트 1팩 README 개수 줄 갱신"
          git push origin HEAD:main
